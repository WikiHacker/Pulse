name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.3)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Client builds only require Go 1.15, but we use 1.22 to match
          # the server toolchain and allow rebuilding anything in-repo.
          go-version: '1.22'

      - name: Build Client Binaries
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## 🚀 Release v${{ steps.version.outputs.version }}

            **Critical memory-stability fix.** Long-running servers were drifting upward in RSS until OOM — the root cause was bbolt's on-disk file ballooning to many times the live-data size while the process mmap'd the whole thing. Two complementary vacuum passes (online at startup, offline at shutdown) now bound the file to the actual working set, and a few smaller leaks elsewhere were closed in the same pass. **No data migration, no wire-protocol changes; existing clients keep working.**

            ### 🛠️ Critical fixes (memory & disk)

            **Root cause — bbolt mmap × append-only on-disk file**
            - bbolt is append-only: deleted records release pages onto the freelist but the file itself never shrinks. Over weeks of churn (24h tcping window × many clients) `metrics.db` accumulates many times its live-data size. Because bbolt mmaps the entire file into the process address space, every bloat byte eventually becomes RSS as the hourly cleanup loop and `/api/tcping/history` queries touch the mapped pages. Observed in the wild: a 8 MB working set sitting inside a 376 MB file → RSS climbing to ~300 MB and the box eventually OOM-killed after `systemctl restart pulse-server`.

            **Two-stage vacuum**
            - **Startup vacuum** (`NewStore.maybeCompact`) — runs `bolt.Compact` into a sibling `metrics.db.compacting` file and atomically renames over the live DB iff (`size ≥ 16 MB` AND `size ≥ 2× live data`). Per-tx size capped at 64 MB so even multi-GB databases compact with a bounded transient heap. Verified end-to-end on a real 376 MB production DB: collapsed to 8 MB in ~600 ms, every record preserved.
            - **Shutdown vacuum** (`CompactBoltFileAfterClose`) — same heuristic, but runs against the file *after* `db.Close()` succeeds. Bounds the next start's mmap even if the prior run never hit `NewStore.maybeCompact` (think SIGKILL vs graceful SIGTERM). Files already under the threshold are correctly skipped — no thrashing of healthy DBs.
            - **Fail-safe contract** — every failure branch either restores `s.db` to a working handle, or returns a sentinel (`errCompactLeftStoreClosed`) that `NewStore` treats as fatal so systemd restarts cleanly instead of the process limping along with a closed bbolt handle and panicking later on `db.View`.

            **Orphan-bucket cleanup**
            - Two top-level buckets (`tcping_by_client`, `tcping_by_client_target`) and a `config/tcping_index_v1_ready` key were created by an earlier secondary-index experiment that was rolled back in favour of the cursor-seek read path. The current code never references them, but existing DBs still carry tens of megabytes of frozen index pages. `dropOrphanBuckets` removes them on first boot of v1.3.8 — the freed pages go on the freelist and are reclaimed by the same-startup vacuum. Allowlist is explicit so a future migration that adds a new bucket can't accidentally wipe it on rollback.

            **`loginAttempts` map leaked one entry per failed IP probe (forever)**
            - The cleanup condition `time.Since(lastAttempt) > 1h && count == 0` only matched IPs that successfully logged in and then went away — i.e. essentially never. A public-internet server scanned by random bots accumulated one `*loginAttempt` per scanner IP that never got freed. New condition drops any entry whose lockout has expired AND whose last activity is older than 1 h, which is behaviourally equivalent to the intended rate-limit but actually frees rows.

            **Frontend: per-system Chart.js + tcping maps leaked on admin "delete service"**
            - `rowsToRemove.forEach` in `SystemTable.astro` only removed the DOM row — `tcpingCharts`, `tcpingConfigs`, `tcpingActiveTargets`, `tcpingLoadingStates`, `tcpingDataSignatures` all kept the dead system's entries. For users who leave the dashboard open across many admin add/delete cycles each ghost Chart.js instance (canvas refs + datasets + animation handle) stayed pinned. Now every removal calls `cleanupTCPingChart(id)` and drops the per-system Map entries.

            ### 🧪 Verified

            - **Real 376 MB production DB** → startup vacuum → 8 MB; 90 keys / 36071 tcping records / 2 config / 1 auth all intact; orphan buckets gone.
            - **90-day simulation** (200k tcping inserts/month, hourly 24h prune, repeat): file repeatedly ballooned to ~75 MB then vacuumed back to single-digit MB across three monthly cycles. Healthy 4 MB file correctly skipped — no thrash.
            - **Live server run** with the 376 MB DB: vacuum logged, port listened, RSS stabilised at 44 MB and stayed there over 30 s of sampling. Clean SIGTERM → "Database closed cleanly" → offline vacuum correctly skipped (file already healthy).

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8080
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" TOKEN="$NEW_ADMIN_PW" \
              bash scripts/migrate.sh --from https://old.example.com --to https://new.example.com
            ```

            ### 📝 What this builds on

            v1.3.8 inherits everything from v1.3.7: the TCPing chart re-load / jitter fixes, admin-list stability work, server-side cursor-seek read path, and the cumulative one-click migration & backup story (`pulse-{backup,restore,migrate}` CLI) plus the macOS-client parity, glassmorphism theme polish, and SEO pass from v1.3.6. See [v1.3.7 release notes](https://github.com/xhhcn/Pulse/releases/tag/v1.3.7) for the full prior list — every fix above applies on top.
          draft: false
          prerelease: false
